http:
  routers:
    api:
      entryPoints: http
      rule:
        Host(`api.envirosense.local`)
      service: api-service
    web:
      entryPoints: http
      rule:
        Host(`web.envirosense.local`)
      service: web-service
    spa:
      entryPoints: http
      rule:
        Host(`spa.envirosense.local`)
      service: spa-service

  services:
    api-service:
      loadBalancer:
        servers:
          - url: http://api-service:8080/
    web-service:
      loadBalancer:
        servers:
          - url: http://web-service:8080/
    spa-service:
      loadBalancer:
        servers:
          - url: http://spa-service:8080/