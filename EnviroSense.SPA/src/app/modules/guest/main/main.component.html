<!-- Header -->

    <a class="flex items-center gap-3 hover:opacity-90 transition" routerLink="/" aria-label="Go to home">
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white font-bold">ES</span>
      <span class="text-slate-900 font-semibold">EnviroSense</span>
    </a>
    
    <div class="flex items-center gap-2">
      <button nz-button nzType="default" routerLink="/sign-in">Sign in</button>

    <div class="flex items-center gap-4">
