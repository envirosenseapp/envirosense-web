
<section class="bg-slate-50">
  <div class="min-h-[60vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold text-slate-900">Sign in</h1>
      <p class="mt-1 text-slate-600">Access your EnviroSense dashboard.</p>

      <!-- Error message -->
      @if (errorMessage() != null){
        <div class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
          <p class="text-sm text-red-600">{{ errorMessage()?.message }}</p>

          @for (item of errorMessage()?.context; track item.key){
                <p class="text-sm text-red-600">{{ item.key }} -- {{ item.message }} </p>
          }
        </div>
      }

      <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <div class="space-y-1">
          <label for="email" class="block text-sm text-slate-700">Email</label>
          <input id="email" type="email" formControlName="email" nz-input placeholder="you@example.com" [disabled]="isLoading()" />
          <div class="text-xs text-red-600" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Enter a valid email
          </div>
        </div>

        <div class="space-y-1">
          <label for="password" class="block text-sm text-slate-700">Password</label>
          <input id="password" type="password" formControlName="password" nz-input placeholder="••••••••" [disabled]="isLoading()" />
          <div class="text-xs text-red-600" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
            Minimum 8 characters
          </div>
        </div>

        <label nz-checkbox formControlName="remember" [disabled]="isLoading()">Remember me</label>

        <button
          nz-button
          nzType="primary"
          class="w-full"
          [disabled]="form.invalid || isLoading()"
          [nzLoading]="isLoading()">
          {{ isLoading() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>

      <div class="mt-4 text-sm text-slate-600">
        No account?
        <a class="text-blue-600 hover:underline" routerLink="/sign-up">Create one</a>
      </div>
    </div>
  </div>
</section>
