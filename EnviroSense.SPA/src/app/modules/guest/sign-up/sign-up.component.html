<section class="bg-slate-50">
  <div class="min-h-[60vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
      <p class="mt-1 text-slate-600">Start linking thermometers in minutes.</p>

      <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <div class="space-y-1">
          <label for="email" class="block text-sm text-slate-700">Email</label>
          <input id="email" type="email" formControlName="email" nz-input placeholder="you@example.com" />
          <div class="text-xs text-red-600" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Enter a valid email
          </div>
        </div>

        <div class="space-y-1">
          <label for="password" class="block text-sm text-slate-700">Password</label>
          <input id="password" type="password" formControlName="password" nz-input placeholder="••••••••" />
          <div class="text-xs text-red-600" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
            Minimum 8 characters
          </div>
        </div>

        <div class="space-y-1">
          <label for="confirmPassword" class="block text-sm text-slate-700">Confirm password</label>
          <input id="confirmPassword" type="password" formControlName="confirmPassword" nz-input placeholder="••••••••" />
          <div class="text-xs text-red-600" *ngIf="form.touched && form.hasError('notSame')">
            Passwords do not match
          </div>
        </div>

        <label nz-checkbox formControlName="agree">
          I agree to the <a routerLink="/terms" class="text-blue-600 hover:underline">Terms</a> and <a routerLink="/privacy" class="text-blue-600 hover:underline">Privacy</a>
        </label>

        <button nz-button nzType="primary" class="w-full" [disabled]="form.invalid">Create account</button>
      </form>

      <div class="mt-4 text-sm text-slate-600">
        Already have an account?
        <a class="text-blue-600 hover:underline" routerLink="/sign-in">Sign in</a>
      </div>
    </div>
  </div>
</section>
