<div class="p-6">
  @if (isLoading()) {
    <div class="flex justify-center items-center h-64">
      <nz-spin nzSimple [nzSize]="'large'"></nz-spin>
    </div>
  } @else {
    @if (device()) {

      <h1 class="text-2xl font-semibold text-gray-800 mb-6">Device {{ device()?.name }}</h1>

      <nz-descriptions nzBordered [nzColumn]="1">
        <nz-descriptions-item nzTitle="ID">{{ device()!.id }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Name">{{ device()!.name }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Created At">{{ device()!.createdAt | date:'medium' }}</nz-descriptions-item>
        <nz-descriptions-item nzTitle="Updated At">{{ device()!.updatedAt | date:'medium' }}</nz-descriptions-item>
      </nz-descriptions>
    } @else {
      <nz-empty nzNotFoundImage="simple"></nz-empty>
    }
  }
</div>

<div class="p-6">
  <nz-tabs nzLinkRouter>
    <nz-tab>
      <a *nzTabLink nz-tab-link [routerLink]="['/dashboard/devices', device()!.id]">
        <nz-icon nzType="unordered-list" theme="outline"/>
        Measurements
      </a>
    </nz-tab>
    <nz-tab >
      <a *nzTabLink nz-tab-link [routerLink]="['/dashboard/devices', device()!.id,'graph']">
        <nz-icon nzType="area-chart" theme="outline"/>
        Graph
      </a>
    </nz-tab>
  </nz-tabs>
  <router-outlet></router-outlet>
</div>
